[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coupling-core"
version = "1.0.1"
description = "Shared library for git co-change matrix analysis, normalization, and coupling scoring."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Meru Patel" }]
keywords = ["git", "coupling", "co-change", "analysis", "churn", "static-analysis"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Version Control :: Git",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = [
    "GitPython>=3.1.50",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=6.1.0",
    "ruff>=0.11",
    "mypy>=1.15",
    "build>=1.2",
    "python-semantic-release>=9.0",
]

[project.urls]
Homepage = "https://github.com/Meru143/coupling-core"
Repository = "https://github.com/Meru143/coupling-core"
Issues = "https://github.com/Meru143/coupling-core/issues"
Changelog = "https://github.com/Meru143/coupling-core/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/coupling_core"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src/coupling_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.semantic_release]
version_variables = ["src/coupling_core/__init__.py:__version__"]
version_toml = ["pyproject.toml:project.version"]
branch = "main"
upload_to_pypi = true
upload_to_release = true
build_command = "python -m build"
commit_parser = "conventional"

[tool.semantic_release.commit_parser_options]
allowed_tags = ["feat", "fix", "perf", "docs", "style", "refactor", "test", "build", "ci", "chore"]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]
